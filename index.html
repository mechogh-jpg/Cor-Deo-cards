<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Mobile-first: the layout reacts to the width of the embed frame. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>COR DEO — Card Deck</title>
  <meta name="description" content="COR DEO — an interactive card deck for prayer and reflection. Tap a card to turn it over.">
  <meta name="theme-color" content="#070a1a">

  <!-- Fonts: elegant serif for headings, clean sans for the interface.
       If Google Fonts is blocked the CSS falls back to Georgia / system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap">

  <style>
/* ============================================================================
   COR DEO — STYLESHEET
   ----------------------------------------------------------------------------
   Sections
     1. Design tokens (colors, spacing, type) + light / dark themes
     2. Base & layout helpers
     3. Masthead & ornaments
     4. Buttons, search, toolbar
     5. Card of the Day (hero)
     6. Deck grid (responsive)
     7. The card itself (3D flip, hover, highlight, loading, errors)
     8. Full-screen viewer
     9. Footer, notices, empty state
    10. Embed options (?compact=1, ?bg=transparent)
    11. Reduced motion
   ============================================================================ */


/* ============================================================================
   1. DESIGN TOKENS
   ============================================================================ */
:root {
  /* Typography */
  --font-display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

  /* Palette — dark ("midnight & gold") is the default */
  --bg-0: #060918;
  --bg-1: #0c1230;
  --bg-glow: rgba(216, 180, 90, 0.10);
  --surface: rgba(255, 255, 255, 0.045);
  --surface-strong: rgba(255, 255, 255, 0.09);
  --line: rgba(216, 180, 90, 0.22);
  --line-strong: rgba(216, 180, 90, 0.55);
  --text: #f4edda;
  --text-muted: #a9a290;
  --gold: #d8b45a;
  --gold-bright: #f3d98f;
  --gold-deep: #9c7a2c;
  --on-gold: #20170a;
  --shadow-card: 0 18px 40px -18px rgba(0, 0, 0, 0.75), 0 2px 6px rgba(0, 0, 0, 0.4);
  --shadow-card-hover: 0 28px 55px -16px rgba(0, 0, 0, 0.85), 0 0 0 1px var(--line-strong), 0 0 38px -6px rgba(216, 180, 90, 0.45);
  --placeholder-a: #141a3d;
  --placeholder-b: #1f2757;
  --toolbar-bg: rgba(8, 12, 32, 0.78);
  --overlay-bg: rgba(4, 6, 16, 0.94);
  --leaf-1: #2f5e34; --leaf-2: #4f8a46; --trunk: #6b4a2b;

  /* Geometry */
  --radius-card: 14px;
  --radius-ui: 12px;
  --gap: 14px;
  --gutter: 16px;
  --col-min: 140px;          /* minimum card width -> 2 columns on phones */
  --card-ratio: 5 / 7;       /* overwritten by JS ("auto" measures your images) */
  --ease: cubic-bezier(.22, .8, .24, 1);
  --flip-time: 0.8s;
}

/* Light theme ("ivory & gold") */
:root[data-theme="light"] {
  --bg-0: #f6f0e1;
  --bg-1: #fbf7ec;
  --bg-glow: rgba(176, 138, 52, 0.14);
  --surface: rgba(60, 40, 10, 0.045);
  --surface-strong: rgba(60, 40, 10, 0.09);
  --line: rgba(140, 104, 28, 0.28);
  --line-strong: rgba(140, 104, 28, 0.65);
  --text: #2b2433;
  --text-muted: #6d6551;
  --gold: #9a7420;
  --gold-bright: #b8912e;
  --gold-deep: #6f5214;
  --on-gold: #fffaf0;
  --shadow-card: 0 16px 34px -18px rgba(60, 40, 10, 0.45), 0 2px 5px rgba(60, 40, 10, 0.18);
  --shadow-card-hover: 0 26px 50px -18px rgba(60, 40, 10, 0.5), 0 0 0 1px var(--line-strong), 0 0 30px -8px rgba(154, 116, 32, 0.4);
  --placeholder-a: #e9e0c9;
  --placeholder-b: #f3ecd8;
  --toolbar-bg: rgba(250, 245, 230, 0.85);
  --overlay-bg: rgba(246, 240, 225, 0.97);
}

/* Responsive steps (mobile first) */
@media (min-width: 640px)  { :root { --col-min: 184px; --gap: 18px; --gutter: 24px; } }
@media (min-width: 1024px) { :root { --col-min: 208px; --gap: 22px; --gutter: 32px; } }
@media (min-width: 1500px) { :root { --col-min: 224px; } }


/* ============================================================================
   2. BASE & LAYOUT HELPERS
   ============================================================================ */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: var(--bg-0);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* Embed transparency option: index.html?bg=transparent */
:root[data-bg="transparent"] html,
:root[data-bg="transparent"] body { background: transparent; }

/* The app is its own scroll container so it behaves identically in an iframe. */
.app-scroll {
  position: relative;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  background:
    radial-gradient(1100px 520px at 50% -140px, var(--bg-glow), transparent 70%),
    linear-gradient(180deg, var(--bg-1), var(--bg-0) 55%);
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}
:root[data-bg="transparent"] .app-scroll { background: none; }
.app-scroll.is-locked { overflow: hidden; }

.container {
  width: 100%;
  max-width: 1320px;
  margin-inline: auto;
  padding-inline: var(--gutter);
}

.icon {
  width: 1.15em; height: 1.15em;
  fill: none; stroke: currentColor;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  flex: none;
}

.sr-only {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }
[hidden] { display: none !important; }


/* ============================================================================
   3. MASTHEAD & ORNAMENTS
   ============================================================================ */
.masthead {
  text-align: center;
  padding-top: clamp(28px, 6vw, 64px);
  padding-bottom: clamp(14px, 3vw, 26px);
}

.masthead-cross {
  width: 26px; height: 26px;
  fill: none; stroke: var(--gold);
  stroke-width: 1.5; stroke-linecap: round;
  margin-bottom: 6px;
  filter: drop-shadow(0 0 10px rgba(216, 180, 90, 0.55));
}

.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(2.3rem, 8vw, 4.4rem);
  letter-spacing: 0.22em;
  text-indent: 0.22em;       /* optically re-centres wide letter-spacing */
  line-height: 1.05;
  /* gold foil text */
  background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 55%, var(--gold-deep) 100%);
  -webkit-background-clip: text; background-clip: text;
  color: transparent;
  text-shadow: 0 0 40px rgba(216, 180, 90, 0.18);
}

.tagline {
  margin: 10px auto 0;
  max-width: 34rem;
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(1.05rem, 2.6vw, 1.35rem);
  color: var(--text-muted);
}
.tagline:empty { display: none; }

.ornament {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-top: 18px;
}
.ornament span {
  height: 1px; width: min(18vw, 120px);
  background: linear-gradient(90deg, transparent, var(--line-strong));
}
.ornament span:last-child { transform: scaleX(-1); }
.ornament i {
  width: 7px; height: 7px;
  background: var(--gold);
  transform: rotate(45deg);
  box-shadow: 0 0 12px rgba(216, 180, 90, 0.7);
}


/* ============================================================================
   4. BUTTONS, SEARCH, TOOLBAR
   ============================================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px;                       /* comfortable touch target */
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font: 500 0.92rem/1 var(--font-ui);
  letter-spacing: 0.02em;
  cursor: pointer;
  color: var(--text);
  background: var(--surface);
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .25s, border-color .25s;
}
.btn:active { transform: scale(.97); }

.btn-primary {
  color: var(--on-gold);
  border-color: transparent;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold) 55%, var(--gold-deep));
  box-shadow: 0 8px 22px -10px rgba(216, 180, 90, 0.8);
  font-weight: 600;
}
.btn-ghost:hover { border-color: var(--line-strong); background: var(--surface-strong); }
@media (hover: hover) {
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px -10px rgba(216, 180, 90, 0.95); }
}

/* Sticky toolbar */
.toolbar-wrap {
  position: sticky; top: var(--tabs-h, 0px); z-index: 20;     /* sits right under the tab bar */
  padding-block: 10px;
  background: var(--toolbar-bg);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  border-block: 1px solid var(--line);
}
.toolbar {
  display: grid;
  grid-template-columns: 1fr auto;          /* mobile: search | random  */
  grid-template-areas: "search random" "density density";
  gap: 10px;
  align-items: center;
}
.search  { grid-area: search; }
#randomBtn { grid-area: random; }
.seg     { grid-area: density; justify-self: center; }

@media (min-width: 720px) {
  .toolbar {
    grid-template-columns: minmax(0, 1fr) auto auto;
    grid-template-areas: "search random density";
    gap: 14px;
  }
  .seg { justify-self: end; }
}
/* Very narrow embeds: hide the label, keep the icon */
@media (max-width: 400px) { #randomBtn { padding: 0 14px; } #randomBtn span { display: none; } }

.search { position: relative; }
.search .icon {
  position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none;
}
.search input {
  width: 100%; min-height: 44px;
  padding: 0 44px 0 42px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  font: 400 1rem var(--font-ui);        /* 16px prevents iOS zoom-on-focus */
  transition: border-color .25s, box-shadow .25s, background .25s;
}
.search input::placeholder { color: var(--text-muted); }
.search input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(216, 180, 90, 0.18); background: var(--surface-strong); }
.search input::-webkit-search-cancel-button { display: none; }
.search-clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border: 0; border-radius: 50%;
  background: transparent; color: var(--text-muted); cursor: pointer;
  display: grid; place-items: center;
}
.search-clear:hover { color: var(--text); background: var(--surface-strong); }
.search-clear .icon { position: static; transform: none; }

/* Segmented "Standard | Large" control */
.seg { display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.seg button {
  min-height: 38px; padding: 0 16px; border: 0; border-radius: 999px;
  background: transparent; color: var(--text-muted);
  font: 500 0.85rem var(--font-ui); cursor: pointer;
  transition: background .25s, color .25s;
}
.seg button[aria-pressed="true"] { background: var(--surface-strong); color: var(--gold-bright); box-shadow: inset 0 0 0 1px var(--line-strong); }


/* ============================================================================
   5. CARD OF THE DAY
   ============================================================================ */
.hero-wrap { padding-block: clamp(10px, 2vw, 22px) clamp(18px, 3vw, 30px); }

.hero {
  display: grid;
  grid-template-columns: 1fr;
  justify-items: center;
  gap: 22px;
  padding: clamp(20px, 4vw, 36px);
  border-radius: 22px;
  border: 1px solid var(--line);
  background:
    radial-gradient(520px 260px at 20% 0%, var(--bg-glow), transparent 70%),
    var(--surface);
  box-shadow: 0 30px 60px -40px rgba(0, 0, 0, 0.8);
}
.hero-slot { width: min(62vw, 250px); }
.hero-copy { text-align: center; max-width: 28rem; }

.kicker {
  margin: 0 0 6px;
  font: 600 0.74rem var(--font-ui);
  letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--gold);
}
.hero-title {
  margin: 0;
  font-family: var(--font-display); font-weight: 600;
  font-size: clamp(1.9rem, 5vw, 2.7rem); line-height: 1.1;
}
.hero-date { margin: 6px 0 0; color: var(--text-muted); font-size: 0.9rem; }
.hero-hint { margin: 14px 0 0; color: var(--text-muted); font-family: var(--font-display); font-style: italic; font-size: 1.1rem; }
.hero-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 18px; }

@media (min-width: 720px) {
  .hero { grid-template-columns: auto 1fr; justify-items: start; align-items: center; gap: clamp(28px, 5vw, 56px); }
  .hero-slot { width: 230px; }
  .hero-copy { text-align: left; }
  .hero-actions { justify-content: flex-start; }
}


/* ============================================================================
   6. DECK GRID
   ============================================================================ */
.deck { padding-block: 22px 12px; }

.status {
  margin: 0 0 16px;
  font-size: 0.85rem; letter-spacing: 0.04em;
  color: var(--text-muted); text-align: center;
  min-height: 1.3em;
}

.grid {
  list-style: none; margin: 0; padding: 0;
  display: grid;
  /* As many columns as fit, never narrower than --col-min. */
  grid-template-columns: repeat(auto-fill, minmax(var(--col-min), 1fr));
  gap: calc(var(--gap) * 1.5) var(--gap);
}
/* "Large" density: bigger cards -> fewer columns */
.grid[data-density="large"] { grid-template-columns: repeat(auto-fill, minmax(calc(var(--col-min) * 1.55), 1fr)); }
@media (max-width: 420px) {
  .grid[data-density="large"] { grid-template-columns: 1fr; padding-inline: 12%; }
}

.card-item {
  position: relative;
  /* NOTE: no `content-visibility` here on purpose — it clips the hover lift and
     the gold highlight glow. Lazy image loading already keeps the page light. */
}
.card-item[hidden] { display: none !important; }

.caption {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  margin-top: 10px;
  font-size: 0.78rem; letter-spacing: 0.04em;
  color: var(--text-muted);
  text-align: center;
}
.caption .num { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; color: var(--gold); letter-spacing: 0.1em; }
.caption .name {
  max-width: 100%; line-height: 1.3; font-size: 0.82rem; color: var(--text);
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
}


/* ============================================================================
   7. THE CARD  (3D flip)
   ----------------------------------------------------------------------------
   .card         outer: perspective, hover lift, focus ring, highlight
   .card-inner   the element that rotates 180° on flip
   .face         front / back — both absolutely stacked, backface hidden
   ============================================================================ */
.card {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: var(--card-ratio);       /* identical size for every card */
  perspective: 1400px;
  cursor: pointer;
  border-radius: var(--radius-card);
  touch-action: manipulation;            /* no double-tap zoom delay */
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;           /* stops iOS long-press image menu */
  transition: transform .45s var(--ease), filter .45s;
  outline-offset: 5px;
}

.card-inner {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transition: transform var(--flip-time) var(--ease);
  border-radius: inherit;
  box-shadow: var(--shadow-card);
  will-change: transform;
}
.card.is-flipped .card-inner { transform: rotateY(180deg); }

.face {
  position: absolute; inset: 0;
  overflow: hidden;
  border-radius: inherit;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  background: linear-gradient(135deg, var(--placeholder-a), var(--placeholder-b));
  border: 1px solid var(--line);
}
.face-back { transform: rotateY(180deg); }

.face img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: var(--img-fit, cover);
  opacity: 0;
  transition: opacity .6s ease;
  pointer-events: none;                  /* clicks go to the card, not the <img> */
  -webkit-user-drag: none;
}
.face.is-loaded img { opacity: 1; }

/* Shimmer while an image is loading */
.face:not(.is-loaded):not(.is-error)::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(216, 180, 90, 0.18) 50%, transparent 70%);
  background-size: 220% 100%;
  animation: shimmer 1.6s linear infinite;
}
@keyframes shimmer { from { background-position: 160% 0; } to { background-position: -60% 0; } }

/* Soft diagonal sheen over loaded faces (premium "foil" feel) */
.face.is-loaded::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.14) 50%, rgba(255,255,255,0) 65%);
  background-size: 250% 100%; background-position: 130% 0;
  transition: background-position 1s var(--ease);
}

/* Graceful fallback when an image is missing */
.face-fallback {
  position: absolute; inset: 0;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  padding: 14px; text-align: center;
  color: var(--text-muted);
  font-size: 0.78rem; line-height: 1.35;
  background:
    repeating-linear-gradient(45deg, transparent 0 14px, rgba(216, 180, 90, 0.05) 14px 15px),
    linear-gradient(135deg, var(--placeholder-a), var(--placeholder-b));
}
.face-fallback svg { width: 30px; height: 30px; fill: none; stroke: var(--gold); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.face-fallback .retry {
  margin-top: 4px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: transparent;
  color: var(--gold-bright); font: 500 0.74rem var(--font-ui); cursor: pointer;
  pointer-events: auto;
}
.face.is-error .face-fallback { display: flex; }
.face.is-error img { display: none; }

/* Desktop hover — only on devices that truly hover (never "sticks" on touch) */
@media (hover: hover) and (pointer: fine) {
  .card:hover { transform: translateY(-8px) scale(1.025); z-index: 2; }
  .card:hover .card-inner { box-shadow: var(--shadow-card-hover); }
  .card:hover .face.is-loaded::after { background-position: -30% 0; }
}
.card:active { transform: scale(.985); }

/* Highlight used by "Random Card" and "Find in deck" */
.card.is-highlight { z-index: 3; animation: pop 1s var(--ease); }
.card.is-highlight .card-inner {
  box-shadow: 0 0 0 2px var(--gold-bright), 0 0 46px 6px rgba(243, 217, 143, 0.55), var(--shadow-card);
  animation: glow 1.5s ease-in-out 3;
}
@keyframes pop  { 0% { transform: scale(1); } 35% { transform: scale(1.07); } 100% { transform: scale(1); } }
@keyframes glow { 50% { box-shadow: 0 0 0 3px var(--gold-bright), 0 0 70px 12px rgba(243, 217, 143, 0.75), var(--shadow-card); } }

/* Small "expand" button (accessible alternative to double-click / long-press) */
.expand-btn {
  position: absolute; top: 8px; right: 8px; z-index: 4;
  width: 34px; height: 34px; padding: 0;
  display: grid; place-items: center;
  border-radius: 50%; border: 1px solid var(--line-strong);
  background: rgba(6, 9, 24, 0.62); color: var(--gold-bright);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  cursor: pointer;
  opacity: 0; transform: scale(.9);
  transition: opacity .25s, transform .25s var(--ease);
}
.card-item:hover .expand-btn,
.expand-btn:focus-visible { opacity: 1; transform: scale(1); }
@media (hover: none) { .expand-btn { opacity: .85; transform: none; width: 32px; height: 32px; } }


/* ============================================================================
   8. FULL-SCREEN VIEWER
   ============================================================================ */
/* STACKING: the viewer must sit above EVERYTHING on the page.
   1) It is opened with the browser's "top layer" (popover="manual" + showPopover()),
      which is painted above all other elements regardless of z-index.
   2) Older browsers without popover fall back to the maximum z-index below.
   3) It is a direct child of <body>, never inside the scrolling app, so no parent
      can clip it or create a lower stacking context. */
.viewer {
  position: fixed; inset: 0; z-index: 2147483647;
  width: 100vw; height: 100vh;          /* fallback */
  width: 100%;  height: 100dvh;         /* dynamic height: stays correct behind mobile browser bars */
  max-width: none; max-height: none;
  margin: 0; padding: 0; border: 0;     /* cancel the browser's default popover box */
  overflow: hidden;
  color: var(--text);
  display: flex; flex-direction: column;
  background: var(--overlay-bg);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  animation: fade .3s ease;
}
.viewer::backdrop { background: transparent; }
/* While the viewer is open, the page's own toolbar can't show through or compete. */
.app-scroll.is-locked .toolbar-wrap { visibility: hidden; }
@keyframes fade { from { opacity: 0; } }

.viewer-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px var(--gutter);
  padding-top: max(10px, env(safe-area-inset-top));
}
.viewer-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; min-width: 0; }
.viewer-title strong { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; color: var(--gold-bright); }
.chip { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 0.7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.viewer-count { font-size: 0.8rem; color: var(--text-muted); }
.viewer-actions { display: flex; gap: 8px; }

.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface);
  color: var(--text); cursor: pointer;
  transition: background .25s, border-color .25s, transform .25s var(--ease);
}
.icon-btn:hover { background: var(--surface-strong); border-color: var(--line-strong); }
.icon-btn:active { transform: scale(.94); }

.viewer-stage {
  flex: 1; min-height: 0;
  position: relative;
  display: grid; place-items: center;
  padding: 8px 56px;
  touch-action: pan-y;
}
@media (max-width: 640px) { .viewer-stage { padding-inline: 12px; } }

/* The big card scales to fit BOTH width and height of the free area.
   JS (fitViewerCard) sets the exact pixel size inline; the rules below are only
   a fallback for the first paint. */
.viewer-card {
  height: 100%; max-height: 100%;
  max-width: 100%;
  aspect-ratio: var(--card-ratio);
  perspective: 1800px;
  cursor: pointer;
}

/* ---- "Fit screen" button + mode ------------------------------------------ */
.fit-btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  color: var(--text); font: 500 0.85rem var(--font-ui); cursor: pointer;
  transition: background .25s, border-color .25s, color .25s, transform .25s var(--ease);
}
.fit-btn:hover { background: var(--surface-strong); border-color: var(--line-strong); }
.fit-btn:active { transform: scale(.96); }
.fit-btn[aria-pressed="true"] { color: var(--on-gold); border-color: transparent; background: linear-gradient(135deg, var(--gold-bright), var(--gold)); }
@media (max-width: 520px) {            /* phones: icon only, same 44px touch target */
  .fit-btn { width: 44px; padding: 0; justify-content: center; }
  .fit-btn span { display: none; }
}

/* Fit mode: the card gets the WHOLE screen. The bar floats over it and fades out;
   safe-area padding keeps the photo clear of notches and rounded corners. */
.viewer.is-fit .viewer-bar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  background: linear-gradient(180deg, rgba(0, 0, 0, .72), transparent);
}
.viewer.is-fit .viewer-stage {
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.viewer.is-fit .viewer-hint { display: none; }
.viewer.is-fit .viewer-inner { border-radius: 10px; box-shadow: none; }
.viewer.is-fit .viewer-inner .face { border-radius: 10px; }
.viewer-bar { transition: opacity .35s ease; }
.viewer.is-fit.chrome-hidden .viewer-bar,
.viewer.is-fit.chrome-hidden .nav-btn { opacity: 0; pointer-events: none; }
.viewer-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform .9s var(--ease);
  border-radius: var(--radius-card);
  box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.9), 0 0 0 1px var(--line-strong);
}
.viewer-inner.is-flipped { transform: rotateY(180deg); }
.viewer-inner .face { border-radius: var(--radius-card); }

/* LARGE VIEW: the picture is always shown whole (object-fit: contain), never cropped,
   whatever the image's own shape. The frame itself is sized by JS to match the picture,
   so there are no empty bars either. */
.viewer-inner .face img { object-fit: contain; }

/* Never let anything in the viewer scroll or spill past the screen edges. */
.viewer-stage { overflow: hidden; }

/* Short screens (phones held sideways, small embeds): give the card the room the hint would use. */
@media (max-height: 520px) {
  .viewer-hint { display: none; }
  .viewer-bar { padding-block: 6px; padding-top: max(6px, env(safe-area-inset-top)); }
  .viewer-stage { padding-block: 4px; }
  .icon-btn, .fit-btn { height: 40px; } .icon-btn { width: 40px; }
}

.nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface-strong);
  color: var(--gold-bright); cursor: pointer; z-index: 2;
  transition: background .25s, transform .25s var(--ease), opacity .35s ease;
}
.nav-btn:hover { background: var(--surface); transform: translateY(-50%) scale(1.08); }
.nav-prev { left: 8px; } .nav-next { right: 8px; }
@media (max-width: 640px) { .nav-btn { width: 40px; height: 40px; background: rgba(6, 9, 24, .55); } .nav-prev { left: 4px; } .nav-next { right: 4px; } }

.viewer-hint {
  margin: 0; padding: 8px var(--gutter) max(14px, env(safe-area-inset-bottom));
  text-align: center; font-size: 0.78rem; letter-spacing: .05em; color: var(--text-muted);
}


/* ============================================================================
   9. FOOTER, NOTICES, EMPTY STATE
   ============================================================================ */
.footer { text-align: center; padding-block: 40px 56px; color: var(--text-muted); font-size: 0.85rem; letter-spacing: .08em; }
.footer p { margin: 14px 0 0; }

.notice {
  margin: 8px 0 0; padding: 12px 16px;
  border-radius: var(--radius-ui);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 0.85rem; text-align: center;
}
.notice strong { color: var(--gold-bright); }

.empty { text-align: center; padding: 56px 0; color: var(--text-muted); }
.empty p { font-family: var(--font-display); font-style: italic; font-size: 1.4rem; margin: 0 0 16px; }


/* ============================================================================
   10. EMBED OPTIONS
   ============================================================================ */
/* index.html?compact=1 -> hides the big masthead (use if your Site page already has a title) */
:root[data-compact="1"] .masthead { display: none; }
:root[data-compact="1"] .hero-wrap { padding-top: 18px; }


/* ============================================================================
   11. REDUCED MOTION  (respects the visitor's system setting)
   ============================================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  /* Flip still works, it just swaps instantly. */
}


/* ============================================================================
   12. TABS, "ZIEHE DEINE KARTE", MY JOURNEY (tree, stats, journal)
   ============================================================================ */

/* ---- Tab bar ---------------------------------------------------------------- */
.tabbar-wrap {
  position: sticky; top: 0; z-index: 25;
  background: var(--toolbar-bg);
  -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%);
  border-block: 1px solid var(--line);
}
.tabbar { display: flex; justify-content: center; gap: 6px; padding-block: 8px; }
.tab {
  flex: 1 1 0; max-width: 210px; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 12px; border-radius: 999px;
  border: 1px solid transparent; background: transparent;
  color: var(--text-muted); font: 500 0.92rem var(--font-ui); letter-spacing: .02em; cursor: pointer;
  transition: background .25s, color .25s, border-color .25s;
}
.tab:hover { color: var(--text); background: var(--surface); }
.tab[aria-selected="true"] { color: var(--gold-bright); background: var(--surface-strong); border-color: var(--line-strong); }
@media (max-width: 420px) { .tab { font-size: .82rem; gap: 5px; padding: 0 6px; } .tab .icon { width: 1.05em; height: 1.05em; } }

.btn:disabled { opacity: .55; cursor: default; transform: none; }
.btn-xl { min-height: 58px; padding: 0 34px; font-size: 1.08rem; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: .8rem; }
.btn.is-armed { border-color: #d9534f; color: #ff9a95; }

/* ---- DRAW: the face-down deck ---------------------------------------------- */
.draw { display: grid; gap: 30px; padding-block: 26px 34px; align-items: center; }
@media (min-width: 860px) {
  .draw { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 64px; padding-block: 48px 56px; }
}

.draw-stage {
  position: relative;
  width: min(66vw, 290px);
  aspect-ratio: var(--card-ratio);
  margin-inline: auto;
}
/* soft golden halo behind the deck */
.draw-stage::before {
  content: ""; position: absolute; inset: -26% -36%;
  background: radial-gradient(closest-side, rgba(243, 217, 143, .30), transparent 70%);
  animation: breathe 5s ease-in-out infinite; pointer-events: none;
}
@keyframes breathe { 50% { transform: scale(1.08); opacity: .75; } }

.deck {
  position: absolute; inset: 0;
  animation: float 6s ease-in-out infinite;
  transition: opacity .5s ease, transform .6s var(--ease);
}
@keyframes float { 50% { transform: translateY(-7px); } }
.deck.is-gone { opacity: 0; transform: scale(.92) translateY(12px); pointer-events: none; animation: none; }

.deck-card {
  position: absolute; inset: 0;
  border-radius: var(--radius-card);
  background: var(--deck-bg) center / cover no-repeat, linear-gradient(135deg, var(--placeholder-a), var(--placeholder-b));
  border: 1px solid var(--line-strong);
  box-shadow: 0 14px 30px -14px rgba(0, 0, 0, .8), inset 0 0 0 3px rgba(0, 0, 0, .14);
  transform: translate(calc(var(--i) * 2.5px), calc(var(--i) * 3px)) rotate(calc(var(--r) * 1deg));
}

/* shuffle: the cards swing out to the sides and back, one after another */
.deck.is-shuffling { animation: none; }
.deck.is-shuffling .deck-card { animation: shuffleL 1.1s var(--ease) both; animation-delay: calc(var(--i) * 70ms); }
.deck.is-shuffling .deck-card:nth-child(even) { animation-name: shuffleR; }
@keyframes shuffleL { 35% { transform: translate(-34%, -4%) rotate(-9deg); } 70% { transform: translate(-4%, 1%) rotate(2deg); } }
@keyframes shuffleR { 35% { transform: translate(34%, 4%) rotate(9deg); }  70% { transform: translate(4%, -1%) rotate(-2deg); } }

/* the top card turns edge-on ... and the real card turns in */
.deck.is-lifting .deck-card:first-child {
  transform: translateY(-14px) perspective(900px) rotateY(90deg) scale(1.05);
  transition: transform .38s cubic-bezier(.5, 0, .9, .6);
}

.draw-slot { position: absolute; inset: 0; }
.slot-card { width: 100%; height: 100%; }
.slot-card .card { height: 100%; }
.slot-card.is-revealing { animation: reveal .8s var(--ease) both; }
.slot-card.is-revealing .card-inner { animation: revealGlow 2.4s ease-out both; }
@keyframes reveal {
  from { transform: perspective(1100px) rotateY(-90deg) scale(.92); opacity: 0; }
  35%  { opacity: 1; }
  to   { transform: perspective(1100px) rotateY(0) scale(1); }
}
@keyframes revealGlow { 0% { box-shadow: 0 0 0 2px var(--gold-bright), 0 0 80px 10px rgba(243, 217, 143, .7); } 100% { box-shadow: var(--shadow-card); } }

/* ---- DRAW: text panel -------------------------------------------------------- */
.draw-panel { text-align: center; min-width: 0; }
@media (min-width: 860px) { .draw-panel { text-align: left; } }
.draw-title {
  margin: 4px 0 10px;
  font-family: var(--font-display); font-weight: 600; line-height: 1.08;
  font-size: clamp(2rem, 5.2vw, 3.1rem);
}
.draw-lead {
  margin: 0 auto 22px; max-width: 30rem;
  font-family: var(--font-display); font-style: italic; font-size: 1.22rem; color: var(--text-muted);
}
@media (min-width: 860px) { .draw-lead { margin-inline: 0; } }
.mini { margin: 16px 0 0; font-size: .78rem; letter-spacing: .04em; color: var(--text-muted); }
.status-msg { min-height: 1.5em; margin: 12px 0 0; color: var(--gold-bright); font-size: .92rem; }

.field-label {
  display: block; text-align: left; margin: 20px 0 6px;
  font: 600 .74rem var(--font-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--gold);
}
#reflect {
  width: 100%; min-height: 112px; padding: 13px 15px; resize: vertical;
  border-radius: 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text);
  font: 400 1rem/1.5 var(--font-ui);
  transition: border-color .25s, box-shadow .25s, background .25s;
}
#reflect::placeholder { color: var(--text-muted); }
#reflect:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(216, 180, 90, .18); background: var(--surface-strong); }
.draw-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; justify-content: center; }
@media (min-width: 860px) { .draw-actions { justify-content: flex-start; } }

/* ---- MY JOURNEY: tree + stats + journal -------------------------------------- */
.journey { display: grid; gap: 22px; padding-block: 26px 36px; }

.tree-card {
  display: grid; gap: 18px; justify-items: center; text-align: center;
  padding: clamp(18px, 4vw, 34px);
  border-radius: 22px; border: 1px solid var(--line);
  background: radial-gradient(560px 280px at 20% 0%, var(--bg-glow), transparent 70%), var(--surface);
}
@media (min-width: 720px) {
  .tree-card { grid-template-columns: 270px 1fr; justify-items: start; text-align: left; gap: 40px; align-items: center; }
  .tree-card .draw-lead { margin-inline: 0; }
}
.tree-svg { width: min(68vw, 250px); height: min(76vw, 280px); }
.tree-svg svg { display: block; width: 100%; height: 100%; transform-origin: 50% 92%; animation: grow 1s var(--ease) both; }
@keyframes grow { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }

.t-ground { fill: rgba(216, 180, 90, .14); }
.t-mound  { fill: #5a4128; }
.t-seed   { fill: var(--gold-bright); filter: drop-shadow(0 0 6px rgba(243, 217, 143, .8)); }
.t-stem   { fill: none; stroke: var(--leaf-2); stroke-width: 4; stroke-linecap: round; }
.t-trunk  { fill: var(--trunk); }
.t-branch { fill: none; stroke: var(--trunk); stroke-width: 5; stroke-linecap: round; }
.t-leaf   { fill: var(--leaf-1); }
.t-leaf2  { fill: var(--leaf-2); }
.t-fruit  { fill: var(--gold-bright); stroke: var(--gold-deep); stroke-width: .8; filter: drop-shadow(0 0 4px rgba(243, 217, 143, .9)); }
.t-rays line { stroke: var(--gold); stroke-width: 2; stroke-linecap: round; opacity: .35; }

.progress { height: 8px; max-width: 26rem; margin: 6px auto 0; border-radius: 999px; background: var(--surface-strong); overflow: hidden; }
@media (min-width: 720px) { .progress { margin-inline: 0; } }
.progress span { display: block; height: 100%; width: 4%; border-radius: inherit; background: linear-gradient(90deg, var(--gold-deep), var(--gold-bright)); transition: width .9s var(--ease); }

.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
.stat { padding: 16px 10px; text-align: center; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.stat-n { display: block; font-family: var(--font-display); font-weight: 600; font-size: 2.4rem; line-height: 1.1; color: var(--gold-bright); }
.stat-l { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-muted); }

.journal-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
.journal-title { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.9rem; }
.journal-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.entries { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.entry {
  display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: start;
  padding: 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface);
}
.entry-thumb { width: 64px; aspect-ratio: var(--card-ratio); padding: 0; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--placeholder-a); cursor: pointer; }
.entry-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.entry-date { margin: 0; font-size: .75rem; letter-spacing: .04em; color: var(--text-muted); }
.entry-title { margin: 2px 0 6px; font-family: var(--font-display); font-weight: 600; font-size: 1.28rem; line-height: 1.2; }
.entry-title span { color: var(--gold); margin-right: 4px; }
.entry-note { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry-note.is-empty { color: var(--text-muted); font-style: italic; }
.entry-del { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--text-muted); cursor: pointer; }
.entry-del:hover { background: var(--surface-strong); color: var(--text); }

</style>
