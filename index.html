<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Mobile-first: the layout reacts to the width of the embed frame. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>COR DEO — Card Deck</title>
  <meta name="description" content="COR DEO — an interactive card deck for prayer and reflection. Tap a card to turn it over.">
  <meta name="theme-color" content="#070a1a">

  <!-- Fonts: elegant serif for headings, clean sans for the interface.
       If Google Fonts is blocked the CSS falls back to Georgia / system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- ======================================================================
       APP  (this element is the scroll container — important inside iframes)
       ====================================================================== -->
  <div class="app-scroll" id="app">

    <!-- ---------- Masthead ---------- -->
    <header class="masthead container" id="masthead">
      <svg class="masthead-cross" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2.5v19M6.5 8.5h11" />
      </svg>
      <h1 class="title" id="deckTitle">COR DEO</h1>
      <p class="tagline" id="deckTagline"></p>
      <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
    </header>

    <!-- Notices (demo mode, odd number of images …) -->
    <div class="container"><p class="notice" id="notice" role="status" hidden></p></div>

    <!-- ---------- Card of the Day ---------- -->
    <section class="container hero-wrap" id="hero" aria-labelledby="heroKicker">
      <div class="hero">
        <div class="hero-slot" id="heroSlot"></div>
        <div class="hero-copy">
          <p class="kicker" id="heroKicker" data-i18n="cardOfTheDay">Card of the Day</p>
          <h2 class="hero-title" id="heroTitle"></h2>
          <p class="hero-date" id="heroDate"></p>
          <p class="hero-hint" data-i18n="cardOfTheDayHint">Tap the card to turn it over.</p>
          <div class="hero-actions">
            <button type="button" class="btn btn-ghost" id="heroFind" data-i18n="showInDeck">Find in deck</button>
            <button type="button" class="btn btn-ghost" id="heroOpen" data-i18n="viewLarge">View large</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- Toolbar (sticky) ---------- -->
    <div class="toolbar-wrap" id="toolbar">
      <div class="container toolbar">

        <div class="search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
                 enterkeyhint="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchLabel"
                 placeholder="Search by number or title…" aria-label="Search cards">
          <button type="button" class="search-clear" id="searchClear" hidden data-i18n-aria="clearSearch" aria-label="Clear search">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <button type="button" class="btn btn-primary" id="randomBtn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          <span data-i18n="randomCard">Random Card</span>
        </button>

        <div class="seg" id="density" role="group" data-i18n-aria="densityLabel" aria-label="Card size">
          <button type="button" data-density="standard" aria-pressed="true" data-i18n="densityStandard">Standard</button>
          <button type="button" data-density="large" aria-pressed="false" data-i18n="densityLarge">Large</button>
        </div>

      </div>
    </div>

    <!-- ---------- Deck grid ---------- -->
    <div class="container deck">
      <p class="status" id="status"></p>
      <ol class="grid" id="grid" data-density="standard"></ol>

      <div class="empty" id="empty" hidden>
        <p data-i18n="noResults">No cards match your search.</p>
        <button type="button" class="btn btn-ghost" id="emptyClear" data-i18n="clearSearch">Clear search</button>
      </div>
    </div>

    <footer class="container footer">
      <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
      <p id="footerText"></p>
    </footer>

    <noscript><p class="notice" style="margin:2rem auto;max-width:36rem">Please enable JavaScript to view the card deck.</p></noscript>
  </div>


  <!-- ======================================================================
       FULL-SCREEN VIEWER  (double-click / long-press / "expand" button)
       ====================================================================== -->
  <div class="viewer" id="viewer" role="dialog" aria-modal="true" data-i18n-aria="viewerLabel" aria-label="Card viewer" hidden>

    <header class="viewer-bar">
      <div class="viewer-title">
        <strong id="viewerTitle"></strong>
        <span class="chip" id="viewerFace"></span>
        <span class="viewer-count" id="viewerCount"></span>
      </div>
      <div class="viewer-actions">
        <button type="button" class="icon-btn" id="viewerFlip" data-i18n-aria="flipCard" aria-label="Flip card">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
        <button type="button" class="icon-btn" id="viewerFs" hidden data-i18n-aria="enterFullscreen" aria-label="Enter full screen">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
        </button>
        <button type="button" class="icon-btn" id="viewerClose" data-i18n-aria="close" aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <div class="viewer-stage" id="viewerStage">
      <button type="button" class="nav-btn nav-prev" id="viewerPrev" data-i18n-aria="previous" aria-label="Previous card">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>

      <div class="viewer-card" id="viewerCard">
        <div class="viewer-inner" id="viewerInner"><!-- faces are inserted by JS --></div>
      </div>

      <button type="button" class="nav-btn nav-next" id="viewerNext" data-i18n-aria="next" aria-label="Next card">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <p class="viewer-hint" data-i18n="viewerHint">Tap the card to flip · swipe or use ← → to browse</p>
  </div>

  <!-- Screen-reader announcements (random card, search results …) -->
  <p class="sr-only" id="live" aria-live="polite"></p>

  <!-- Load order matters: data first, then the app. -->
  <script src="js/cards-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
